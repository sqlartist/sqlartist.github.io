name: Sync from Medium

on:
  schedule:
    - cron: '0 6 * * *' # every morning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:medium
      - name: Save new stories
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add src/content/posts public/images/medium
          if git diff --cached --quiet; then
            echo "Nothing new on Medium."
          else
            git commit -m "Sync new stories from Medium"
            git push
          fi
